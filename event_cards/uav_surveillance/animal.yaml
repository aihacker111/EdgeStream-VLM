id: animal
version: 1
name: Animal
short: an animal (dog, cow, horse ...) is present where it should not be
definition: An animal is on a road, path or area of the scene where animals are not normally present.
positive_cues:
- four-legged shape, not a person or vehicle
- moving independently of any person
negative_cues:
- a dog on a leash next to its owner on a footpath
- shadows, leaves or moving water
severity: medium
