id: loitering
version: 1
name: Loitering
short: a person lingers in one area for a long time without a clear purpose
definition: A person stays in a small area much longer than passers-by, wandering back and forth or circling
  without a destination.
positive_cues:
- walks back and forth or in circles in the same small area
- keeps watching cars, doors or other people while lingering
- stays much longer than other pedestrians
negative_cues:
- waiting at a bus stop, crossing or entrance
- standing and talking with others
- working (guard, cleaner, vendor) at a fixed spot
severity: low
