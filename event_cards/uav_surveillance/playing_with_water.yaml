id: playing_with_water
version: 1
name: Playing with Water
short: a person plays in or next to water where it is unsafe or not allowed
definition: A person wades, plays, splashes or climbs in a river, pond, fountain or other water area.
positive_cues:
- the person is inside or at the edge of the water
- splashing or wading
negative_cues:
- walking along a path next to the water
- fishing from a designated spot
severity: medium
