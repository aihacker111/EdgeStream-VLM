id: carrying_weapon
version: 1
name: Carrying Weapon
short: a person carries a stick, knife, bat or gun in a threatening way
definition: A person holds a weapon or a weapon-like object (stick, bat, knife, gun).
positive_cues:
- a long rigid object held in the hand
- threatening posture toward others
negative_cues:
- an umbrella, walking stick or tool used normally
- sports equipment on a field
severity: high
