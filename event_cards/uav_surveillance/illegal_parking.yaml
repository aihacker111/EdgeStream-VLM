id: illegal_parking
version: 1
name: Illegal Parking
short: a vehicle is stopped where stopping is not allowed
definition: A vehicle is stopped or parked in a driving lane, on a crossing or another no-parking area.
positive_cues:
- stationary vehicle while other traffic moves around it
negative_cues:
- a car waiting at a traffic light or in a queue
- a marked parking space
severity: low
