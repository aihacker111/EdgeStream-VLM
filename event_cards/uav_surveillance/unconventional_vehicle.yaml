id: unconventional_vehicle
version: 1
name: Unconventional Vehicle
short: an unusual vehicle (scooter, cart, skateboard, tractor ...) in a pedestrian or restricted area
definition: 'A vehicle that does not belong in this area appears: e.g. electric scooter, skateboard, cart,
  tractor, or any vehicle on a pedestrian-only area.'
positive_cues:
- a person moves at vehicle speed but no bicycle/car is visible
- an unusual vehicle shape among pedestrians
negative_cues:
- a normal car on a road
- a wheelchair or a pram
severity: medium
