id: vehicle_on_walkway
version: 1
name: Vehicle on Walkway
short: a car or motorbike drives or parks on a footpath, lawn or plaza
definition: A motor vehicle drives on or is parked on an area meant for pedestrians (sidewalk, plaza,
  lawn).
positive_cues:
- a vehicle among pedestrians or on paved non-road area
negative_cues:
- a delivery vehicle in a marked loading zone
- a vehicle on the road next to the footpath
severity: medium
