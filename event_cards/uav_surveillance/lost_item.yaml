id: lost_item
version: 1
name: Lost Item
short: an object is dropped or left behind and stays unattended
definition: An object (bag, box, item) is dropped or left on the ground and stays there with no owner
  nearby.
positive_cues:
- a new object that was not there before
- nobody near the object for some time
negative_cues:
- a person put the bag down next to them
- litter bins, benches, parked bikes
severity: medium
