id: wall_climbing
version: 1
name: Wall Climbing
short: a person climbs a wall, fence or building
definition: A person climbs over or onto a wall, fence, gate or building facade.
positive_cues:
- the person is above ground level next to a wall or fence
- moving vertically along a structure
negative_cues:
- walking on a staircase or ramp
- a worker on a ladder
severity: high
