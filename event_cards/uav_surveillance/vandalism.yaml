id: vandalism
version: 1
name: Vandalism
short: someone damages, kicks, paints or breaks property
definition: A person deliberately damages public or private property (kicks, hits, sprays paint, breaks).
positive_cues:
- repeated hitting or kicking of an object
- object visibly damaged or displaced
- spraying or drawing on a wall or vehicle
negative_cues:
- normal maintenance or repair work
- loading or unloading goods
severity: medium
