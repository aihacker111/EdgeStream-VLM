# Online aerial referring MOT ("search, don't filter") - AerialMind (primary benchmark).
# Paths are relative to the project root. Every key maps to RMOTConfig / its sub-configs
# (edgestream/rmot/pipeline.py, tracklets.py, solver.py, scheduler.py, zoom.py).

perception_config: configs/perception.yaml
fps: 30                         # VisDrone / UAVDT frame rate
stride: 1                       # process every frame (GT is per frame)

rmot:
  lag_s: 2.0                    # commit lag L (overridden by --lags); inf = offline
  window_s: 12.0                # solver window W
  reopt_s: 0.5                  # re-optimise every 0.5 s
  group_size: 1                 # 1 = one candidate per call (prompt v2); >1 = set prompt (ablation search_set)
  rounds: 2                     # R: partitions per anchor (each candidate compared with different neighbours)
  k_answers: 2                  # K: answers wanted per piece
  anchor_s: 0.5
  min_ask_s: 0.3
  link_verify: true
  link_band: [0.15, 0.85]
  cover_weight: 0.85            # coverage first: objects nobody asked about go before re-checks (0 = off)
  prior_base: -1.0
  class_mismatch: -8.0
  kin_weight: 1.0
  unmeasured_cap: -0.5
  clip_weight: 0.0              # >0 needs --clip-model
  interp_max_s: 2.0
  zoom: true
  # filter baselines
  keyframe_every: 10            # YesTrack-style keyframe interval in frames
  filter_prompt: single
  filter_facts: false
  graph:
    propagation: identity       # identity: an answer covers the object until a suspicious cut | hops: legacy ablation
    p_prop_length: 0.995        # P(same object) across a cut made only for length
    max_len_s: 1.0
    min_len_s: 0.2
    end_after_s: 0.5
    stitch_gap_s: 3.0
    stitch_gate: 2.5
    moving_bl_s: 0.35
  belief:                       # the method's probabilistic model (edgestream/rmot/belief.py)
    enabled: true               # false (or --no-belief) = heuristic propagation + coverage (ablation)
    # every parameter below is FITTED on the train split by scripts/rmot_fit_belief.py and passed
    # with --belief-params; the values here are only fallbacks
    memory_s: 60.0
    voi_topk: 160
    max_pending_per_tree: 2
    lam: 0.1
  solver:
    tau: 0.0
    lam: 1.0
    kappa: 0.5
    time_limit_s: 0.2
    unverified_w: 0.3
    future_s: 1.0
  sched:
    n_workers: 4                # concurrent requests on one vLLM server (24 GB, Qwen3-VL-4B)
    latency_scale: 1.0          # measured latency of a sequential call -> logical latency
    fixed_latency_s: null
    eps_s: 0.25
  zoom_cfg:
    context: 3.0
    min_crop: 160
    min_iou: 0.3
    conf_thres: 0.25

vlm:
  backend: openai               # openai (vLLM/SGLang server) | transformers | oracle
  prompt: v2                    # v2: one-token yes/no, shared prefix (frame -> description -> candidate)
  frame_width: 1024             # resized frame shown first (identical bytes -> prefix-cached on the server)
  crop_h: 160                   # height of the close-up strip (small objects are up-scaled)
  overview_width: 1280          # set prompt (v1) only
  facts: true                   # measured-motion text for the method (the keyframe filter never sees it)
  openai:
    base_url: http://localhost:8000/v1
    model: Qwen/Qwen3-VL-4B-Instruct-FP8   # or Qwen/Qwen3.5-4B, Qwen/Qwen3-VL-2B-Instruct (must match `vllm serve`)
    chat_template_kwargs: {enable_thinking: false}   # Qwen3.5: no reasoning tokens
    timeout_s: 120
  transformers:                 # no server: python loads the model (--vlm transformers)
    model_id: Qwen/Qwen3-VL-2B-Instruct      # BF16 base of the LoRA; FP8 checkpoints need vLLM/SGLang
    adapter: null                 # or --vlm-adapter runs/lora_vl2b/best (or a merged folder as model_id)
    device: auto
    dtype: auto
    max_batch: 8                  # concurrent one-token requests per forward pass
  oracle:                       # NOT a VLM: GT answers with errors (plumbing / ceiling only)
    acc: 0.9
    conf: 0.85
